# ============================================================
# Neo4j - Configuración para AD Purple Lab
# Compatible con Neo4j 5.x
# ============================================================

# Permitir conexiones desde cualquier IP dentro de la red del lab
server.default_listen_address=0.0.0.0

# Directorios de datos
server.directories.data=/data
server.directories.logs=/logs
server.directories.plugins=/plugins
server.directories.import=/import

# Habilitar HTTP y Bolt
server.http.enabled=true
server.http.listen_address=0.0.0.0:7474
server.http.advertised_address=localhost:7474
server.bolt.enabled=true
server.bolt.listen_address=0.0.0.0:7687
server.bolt.advertised_address=localhost:7687

# Desactivar HTTPS en lab local (habilitar en entornos expuestos)
server.https.enabled=false

# Permitir conexiones Bolt no encriptadas (lab interno)
dbms.ssl.policy.bolt.enabled=false
dbms.ssl.policy.https.enabled=false

# Seguridad: requerir autenticación
dbms.security.auth_enabled=true

# Procedimientos permitidos (necesario para BloodHound si usa APOC)
# Descomentar si instalas el plugin APOC manualmente:
# dbms.security.procedures.allowlist=apoc.*,gds.*
# dbms.security.procedures.unrestricted=apoc.*

# Transaccional
db.transaction.timeout=30s

# Logging
server.logs.debug.enabled=false
