<!-- ============================================================
     Wazuh Manager - Configuración para AD Purple Lab
     Orientada a recolección de eventos de Windows/Active Directory.
     Solo lectura: no se configuran respuestas activas.
     ============================================================ -->

<ossec_config>

  <!-- ── Global ──────────────────────────────────────────── -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wazuh.com</smtp_server>
    <email_from>wazuh@example.wazuh.com</email_from>
    <email_to>recipient@example.wazuh.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <!-- ── Alertas: nivel mínimo 3 (info+) ────────────────── -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ── Remote: escucha de agentes ─────────────────────── -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- ── Integración con OpenSearch vía API ──────────────
       NOTA: Esta sección usa la integración nativa de Wazuh
       con indexer. Para OpenSearch sin TLS (lab), configura:
         DISABLE_SECURITY_PLUGIN=true en opensearch
       y descomenta el bloque indexer abajo si usas
       wazuh-indexer. Para el OpenSearch del proyecto usamos
       Filebeat externo. Ver wazuh/README.md.
       ─────────────────────────────────────────────────── -->

  <!-- ── Sin respuestas activas: SOLO detección ─────────── -->
  <!-- active-response está vacío a propósito -->

  <!-- ── Monitoreo de integridad de archivos (FIM) ────────
       Para el DC Windows: monitorea directorios críticos.
       Configuración adicional se envía desde el manager a
       cada agente via agent.conf.
       ─────────────────────────────────────────────────── -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
    <!-- Directorios monitoreados en el agente Windows -->
    <!-- Se envía vía agent.conf al DC -->
  </syscheck>

  <!-- ── Detección de rootkits: deshabilitado para Windows ─ -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <!-- ── Inventario del sistema ──────────────────────────── -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

  <!-- ── Reglas ──────────────────────────────────────────── -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
  </ruleset>

  <!-- ── Configuración enviada a agentes Windows ─────────── -->
  <agent_config os="Windows">

    <!-- Canales de eventos Windows a monitorear -->
    <!-- Estos son los IDs críticos para AD Purple Team -->

    <!-- Security Log: Logons, Kerberos, NTLM -->
    <localfile>
      <location>Security</location>
      <log_format>eventchannel</log_format>
      <query>
        <![CDATA[
        Event/System[
          (EventID=4624 or   <!-- Logon exitoso -->
           EventID=4625 or   <!-- Logon fallido -->
           EventID=4634 or   <!-- Logoff -->
           EventID=4648 or   <!-- Logon con credenciales explícitas -->
           EventID=4672 or   <!-- Privilegios especiales asignados -->
           EventID=4688 or   <!-- Proceso creado -->
           EventID=4698 or   <!-- Tarea programada creada -->
           EventID=4720 or   <!-- Cuenta de usuario creada -->
           EventID=4722 or   <!-- Cuenta de usuario habilitada -->
           EventID=4723 or   <!-- Intento de cambio de contraseña -->
           EventID=4724 or   <!-- Reset de contraseña por admin -->
           EventID=4725 or   <!-- Cuenta de usuario deshabilitada -->
           EventID=4726 or   <!-- Cuenta de usuario eliminada -->
           EventID=4728 or   <!-- Miembro agregado a grupo global -->
           EventID=4732 or   <!-- Miembro agregado a grupo local -->
           EventID=4756 or   <!-- Miembro agregado a grupo universal -->
           EventID=4768 or   <!-- Kerberos TGT request (AS-REQ) -->
           EventID=4769 or   <!-- Kerberos service ticket (TGS-REQ) -->
           EventID=4771 or   <!-- Kerberos pre-auth fallida -->
           EventID=4776)     <!-- NTLM credential validation -->
        ]
        ]]>
      </query>
    </localfile>

    <!-- System Log: servicios críticos del DC -->
    <localfile>
      <location>System</location>
      <log_format>eventchannel</log_format>
      <query>
        <![CDATA[
        Event/System[EventID=7045 or EventID=7035 or EventID=7036]
        ]]>
      </query>
    </localfile>

    <!-- DNS Server Log (si está habilitado en el DC) -->
    <localfile>
      <location>DNS Server</location>
      <log_format>eventchannel</log_format>
    </localfile>

  </agent_config>

  <!-- ── Logging del manager ─────────────────────────────── -->
  <logging>
    <log_format>json</log_format>
  </logging>

</ossec_config>
