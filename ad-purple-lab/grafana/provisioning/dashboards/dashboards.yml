apiVersion: 1

# ============================================================
# Grafana - Proveedor de dashboards desde archivos
# Los archivos JSON de dashboards van en ./grafana/provisioning/dashboards/
# ============================================================

providers:
  - name: "AD Purple Lab Dashboards"
    orgId: 1
    folder: "AD Purple Lab"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
